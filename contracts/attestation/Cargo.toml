[package]
name = "veritasor-attestation"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.81.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = []

[dependencies]
soroban-sdk = "22.0"
veritasor-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
proptest    = { version = "=1.5.0", default-features = false, features = ["std"] }
veritasor-common = { path = "../common" }
veritasor-attestor-staking = { path = "../attestor-staking" }
# Kani is only pulled in when the kani toolchain is active (`cargo kani`).
# It is absent from normal `cargo test` / `cargo build` runs, so it does not
# affect contract size or test execution time.
kani = { version = "0.57.0", optional = true }

# ── Kani proof harnesses ────────────────────────────────────────────────────
# Each [[bin]] target below corresponds to a file under kani/.  The targets
# are only compiled when `cargo kani` (or `cargo kani --harness <name>`) is
# invoked; they are excluded from normal `cargo test --all` runs because the
# `kani` crate is not present in the default feature set.
#
# Naming convention: one file per logical group of related harnesses.
[[bin]]
name = "kani_flat_fee_overflow"
path = "kani/flat_fee_overflow.rs"
required-features = ["kani"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
